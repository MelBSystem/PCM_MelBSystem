  $('#mSair').onclick=sair;$('#mManual').onclick=abreManual;$('#mEsq').onclick=()=>abreEsquema({});if(isAdm()){$('#mNomes').onclick=()=>formNomes();$('#mUsu').onclick=()=>telaUsuarios();}$('#mImg').onclick=()=>{baixaImagens(true);toast('Baixando imagens…');};
  $('#mFila').onclick=async()=>{const f=(await all('fila')).map(x=>x[1]).sort((a,b)=>a.ts-b.ts);abre('<div class="ph"><b>Fila de envio</b><button class="lnk" data-x>Fechar</button></div>'+(f.length?f.map(o=>'<div class="card" style="cursor:default"><div class="ci"><div class="cd">'+esc(o.tipo)+' · '+esc(o.aba||'imagem')+' '+esc(o.id||'')+'</div><div class="cm">'+new Date(o.ts).toLocaleString('pt-BR')+(o.erro?' · <span class="tag c">'+esc(o.erro)+'</span>':'')+'</div></div><button class="lnk" data-del="'+o.uid+'">Descartar</button></div>').join(''):'<div class="empty">Nada pendente.</div>'));
    $('#pane').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirmar('Descartar este lançamento? Ele não será enviado.'))return;await del('fila',b.dataset.del);S.fila=await count('fila');status();b.closest('.card').remove();});};
}

/* ---- cadastro de usuários (somente administrador, precisa de internet) ---- */
const PERFIS=[['administrador','Administrador — tudo, inclusive usuários e nomes'],['lançar','Lançar — consulta e registra'],['consultar','Consultar — só visualiza']];
async function telaUsuarios(lista){
  if(!lista){
    if(!navigator.onLine){toast('Conecte à internet para gerenciar usuários');return;}
    abre('<div class="ph"><b>Usuários</b><button class="lnk" data-x>Fechar</button></div><div class="empty">Carregando…</div>');
    try{lista=await api('usuarios');}catch(e){abre('<div class="ph"><b>Usuários</b><button class="lnk" data-x>Fechar</button></div><div class="empty">'+esc(e.message)+'</div>');return;}
  }
  const pn=p=>({administrador:'Administrador','lançar':'Lançar',consultar:'Consultar'})[p]||p;
  abre('<div class="ph"><b>Usuários ('+lista.length+')</b><button class="lnk" data-x>Fechar</button></div>'+
    '<div class="btns" style="margin-top:0"><button class="btn p" id="uNovo">+ Novo usuário</button></div>'+
    '<div class="list" style="margin-top:10px">'+lista.map((u,i)=>'<button class="card" data-u="'+i+'"><div class="ci"><div class="cd">'+esc(u.usuario)+(norm(u.usuario)===norm(S.user.nome)?' <span class="cm">(você)</span>':'')+'</div><div class="cm">'+esc(pn(u.perfil))+'</div></div><div class="rt"><span class="tag '+(u.ativo?'':'c')+'">'+(u.ativo?'Ativo':'Desativado')+'</span></div></button>').join('')+'</div>'+
    '<div class="note">As senhas ficam cifradas na aba "Usuários app". Trocar a senha ou desativar desconecta o usuário dos celulares.</div>');
  $('#uNovo').onclick=()=>formUsuario(null,lista);
  $('#pane').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>formUsuario(lista[+b.dataset.u],lista));
}
function formUsuario(u,lista){
  const novo=!u;u=u||{usuario:'',perfil:'lançar',ativo:true};
  const eu=!novo&&norm(u.usuario)===norm(S.user.nome);
  abre('<div class="ph"><b>'+(novo?'Novo usuário':esc(u.usuario))+'</b><button class="lnk" id="uVolta">← Voltar</button></div>'+
    (novo?'<label>ID do usuário (usado para entrar)</label><input id="uN" class="f" autocapitalize="off" spellcheck="false" autocomplete="off">':'')+
    '<label>'+(novo?'Senha':'Nova senha (deixe em branco para manter)')+'</label><input id="uS" class="f" type="text" autocomplete="new-password" placeholder="mínimo 4 caracteres">'+
    '<label>Perfil</label><select id="uP" class="f"'+(eu?' disabled':'')+'>'+PERFIS.map(([k,t])=>'<option value="'+k+'"'+(u.perfil===k?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select>'+
    '<label>Situação</label><select id="uA" class="f"'+(eu?' disabled':'')+'><option value="1"'+(u.ativo?' selected':'')+'>Ativo</option><option value="0"'+(u.ativo?'':' selected')+'>Desativado</option></select>'+
    (eu?'<div class="note">Você não pode desativar nem rebaixar o seu próprio usuário.</div>':'')+
    '<div class="btns"><button class="btn p" id="uSv">'+(novo?'Cadastrar':'Salvar')+'</button></div>');
  $('#uVolta').onclick=()=>telaUsuarios(lista);
  $('#uSv').onclick=async()=>{
    const d={usuario:novo?$('#uN').value.trim():u.usuario,senha:$('#uS').value.trim(),perfil:$('#uP').value,ativo:$('#uA').value==='1',novo};
    if(!d.usuario){toast('Informe o ID');return;}
    if(novo&&d.senha.length<4){toast('A senha precisa ter pelo menos 4 caracteres');return;}
    if(!novo&&d.senha&&d.senha.length<4){toast('A senha precisa ter pelo menos 4 caracteres');return;}
    if(!navigator.onLine){toast('Sem internet');return;}
    $('#uSv').disabled=true;
    try{const l=await api('salvarUsuario',{dados:d});toast(novo?'Usuário cadastrado':'Usuário atualizado');telaUsuarios(l);}
    catch(e){toast(e.message);$('#uSv').disabled=false;}
  };
}
/* renomear os filtros (chips) da tela atual — só muda o nome exibido no app */
function formFiltros(lista){
  const fixos=['A comprar','Atrasada','Vence','Em dia'];
  const L=lista.filter(x=>x);
  abre('<div class="ph"><b>Renomear filtros · '+esc(nomeTela(S.tab))+'</b><button class="lnk" data-x>Fechar</button></div>'+
    '<div class="note">Deixe em branco para voltar ao nome original. Muda só o nome mostrado no app (para todos os celulares); a planilha continua igual.</div>'+
    L.map(x=>{const k='filtro:'+S.tab+':'+x;return '<div class="rn"><span title="'+esc(x)+'">'+esc(x)+(fixos.includes(x)?' <i class="cm">(status)</i>':'')+'</span><input class="f" data-k="'+esc(k)+'" data-v="'+esc(cfg(k))+'" value="'+esc(cfg(k))+'" placeholder="'+esc(x)+'"></div>';}).join('')+
    '<div class="btns" style="position:sticky;bottom:0;background:var(--sf);padding:8px 0"><button class="btn p" id="ffS">Salvar nomes</button></div>');
  $('#ffS').onclick=async()=>{
    const mud=[...$('#pane').querySelectorAll('input[data-k]')].filter(i=>i.value.trim()!==i.dataset.v);
    for(const i of mud) await enfileira({tipo:'config',chave:i.dataset.k,valor:i.value.trim()});
    toast(mud.length?mud.length+' nome(s) alterado(s)':'Nada alterado');fecha();render();

}
/* renomear abas e campos (administrador) — grava na aba "Config app" da planilha */
const ROT_EXTRA=['Data','Turno','Equipamento','Categoria','O que verificar','Tempo parado (min)','Observação','Status','Qtd','Loja','Link de compra','Descrição','Código','ID da peça','Defeito / serviço','Ação realizada','Peças usadas','Área','Tipo','Data da troca','Setor / local','Refletor (identificação)','Potência (W)','Motivo'];
function formNomes(){
  const telas=['pecas','serras','manut','manual','check','led','compras','hist','mais'];
  const vis=['Peças','Serras','manuais_pecas','Manutenção','Histórico','Compras','Checklist itens','Checklist registros','Refletores LED','Kits'];
  const set=[];vis.forEach(n=>aba(n).cab.forEach(c=>{c=String(c).trim();if(c&&set.indexOf(c)<0)set.push(c);}));ROT_EXTRA.forEach(c=>{if(set.indexOf(c)<0)set.push(c);});
  set.sort((x,y)=>x.localeCompare(y,'pt'));
  const linha=(k,orig)=>'<div class="rn"><span title="'+esc(orig)+'">'+esc(orig)+'</span><input class="f" data-k="'+esc(k)+'" data-v="'+esc(cfg(k))+'" value="'+esc(cfg(k))+'" placeholder="'+esc(orig)+'"></div>';
  abre('<div class="ph"><b>Renomear abas e campos</b><button class="lnk" data-x>Fechar</button></div>'+
    '<div class="note">Deixe em branco para voltar ao nome original. A mudança vale para todos os celulares depois de sincronizar. Os nomes na planilha não mudam.</div>'+
    '<div class="grp">Abas do app (nome · rodapé usa o mesmo nome)</div>'+telas.map(t=>linha('aba:'+t,TIT[t])).join('')+
    '<div class="grp">Campos</div><input id="rnQ" class="f" placeholder="Filtrar campos…" style="margin-bottom:6px"><div id="rnL">'+set.map(c=>linha('campo:'+c,c)).join('')+'</div>'+
    '<div class="btns" style="position:sticky;bottom:0;background:var(--sf);padding:8px 0"><button class="btn p" id="rnS">Salvar nomes</button></div>');
  $('#pane').querySelectorAll('.rn span,.rn input').forEach(el=>{delete el.dataset.o;});
  $('#rnQ').oninput=e=>{const q=norm(e.target.value);$('#rnL').querySelectorAll('.rn').forEach(d=>{d.hidden=q&&!norm(d.textContent+' '+d.querySelector('input').value).includes(q);});};
  $('#rnS').onclick=async()=>{
    const mud=[...$('#pane').querySelectorAll('input[data-k]')].filter(i=>i.value.trim()!==i.dataset.v);
    for(const i of mud) await enfileira({tipo:'config',chave:i.dataset.k,valor:i.value.trim()});
    toast(mud.length?mud.length+' nome(s) alterado(s)':'Nada alterado');fecha();render();
  };
}

/* ---------------- início ---------------- */
async function inicio(){
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
  if(!S.user||!S.user.token){S.user=null;$('#vLogin').hidden=false;S.fila=await count('fila');return;}
  S.d=await get('kv','dados');
  if(S.d) marcaLinhas(S.d);
  for(const [k,b] of await all('img')) if(!k.startsWith('vista_')) S.img[k]=b;
  S.fila=await count('fila');
  abreApp();
  if(navigator.onLine) sincroniza(true);
}
inicio();
})();
