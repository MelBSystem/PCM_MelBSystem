<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PCM 2">
<title>PCM 2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f3f4f1;--sf:#fff;--fg:#1c201e;--mu:#5c655e;--ln:#dde1dc;--ac:#0b6e4f;--ac2:#e5f2ec;--wa:#9a5b00;--wa2:#fdf1dc;--cr:#b3261e;--cr2:#fbe7e5;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#111412;--sf:#1a1f1c;--fg:#e8ece9;--mu:#9aa49d;--ln:#2b322d;--ac:#4cc59a;--ac2:#1b2d25;--wa:#e0a74a;--wa2:#2e2513;--cr:#f2867d;--cr2:#341b19}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--ln);padding:calc(8px + env(safe-area-inset-top)) 0 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:0}
.st{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.dot.off{background:var(--wa)}
.iconbtn{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.q{width:100%;margin-top:8px;padding:10px 12px;border:1px solid var(--ln);border-radius:var(--r);background:var(--sf);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipw{position:relative}
.chips{scroll-behavior:smooth;cursor:grab;user-select:none;-webkit-user-select:none}
.chips.arr{cursor:grabbing;scroll-behavior:auto}
.chs{position:absolute;top:8px;bottom:2px;width:46px;border:0;padding:0 6px;z-index:2;cursor:pointer;font-size:30px;line-height:1;font-weight:700;color:var(--ac);display:flex;align-items:center}
.chs.l{left:0;justify-content:flex-start;background:linear-gradient(90deg,var(--bg) 55%,transparent)}
.chs.r{right:0;justify-content:flex-end;background:linear-gradient(270deg,var(--bg) 55%,transparent)}
.chs[hidden]{display:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
main.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.comsel main.wrap{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);margin:10px 0 6px;gap:8px}
.list{display:grid;gap:8px}
.card{display:flex;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:9px;cursor:pointer;text-align:left;width:100%}
.th{flex:none;width:72px;height:72px;border-radius:8px;background:#fff;border:1px solid var(--ln);display:grid;place-items:center;overflow:hidden;color:#999;font-size:10px;text-align:center}
.th img{width:100%;height:100%;object-fit:cover}
.ci{min-width:0;flex:1}
.cd{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--ac)}
.cm{font-size:12px;color:var(--mu);margin-top:2px}
.rt{flex:none;text-align:right;font-weight:700}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--ac2);color:var(--ac);margin-right:4px;font-weight:600}
.tag.w{background:var(--wa2);color:var(--wa)}.tag.c{background:var(--cr2);color:var(--cr)}
.empty{padding:40px 0;text-align:center;color:var(--mu)}
.more{margin:10px auto;display:block;padding:10px 18px;border-radius:var(--r);border:1px solid var(--ln);background:var(--sf);cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(8,1fr);padding:0 2px}
.nb{border:0;background:none;padding:8px 2px 7px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current=page]{color:var(--ac);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;background:var(--ac);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.pane{background:var(--sf);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ph b{font-size:16px}
.lnk{border:0;background:none;color:var(--ac);font-weight:700;cursor:pointer;padding:6px 0}
.big{width:100%;background:#fff;border:1px solid var(--ln);border-radius:10px;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0}
.kv b{color:var(--mu);font-weight:500}
label{display:block;font-size:12px;color:var(--mu);margin-top:9px}
.f{width:100%;padding:10px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);font-size:16px}
textarea.f{min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{padding:10px 14px;border-radius:var(--r);border:1px solid var(--ln);background:var(--sf);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--fg)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.btn[disabled]{opacity:.5}
.stepper{display:flex;align-items:center;gap:8px;margin-top:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);font-size:22px;cursor:pointer}
.stepper input{width:80px;text-align:center}
.note{font-size:12px;color:var(--mu);margin-top:6px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;z-index:50;font-size:14px;max-width:90vw;text-align:center}
.zoom{position:fixed;inset:0;z-index:40;background:#fff;overflow:auto}
.zoom img{width:220%;max-width:none;display:block}
.zoom .x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:41}
.prog{height:6px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--ac);width:0}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login h1{font-size:24px;margin-bottom:4px}
.nb{font-size:10px;white-space:nowrap}
.seg{display:flex;gap:6px;margin:10px 0 4px}
.seg button{flex:1;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 4px;font-size:13px;cursor:pointer}
.seg4 button{line-height:1.2}
@media (max-width:620px){.seg4{flex-wrap:wrap}.seg4 button{flex:1 1 45%}}
.seg button[aria-pressed=true]{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:700}
.grp{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:14px 2px 6px}
.ck{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:10px;margin-bottom:8px;scroll-margin-bottom:150px;scroll-margin-top:150px}
.ck .t{font-weight:600}
.ck .opts{display:flex;gap:6px;margin-top:8px}
.ck .opts button{flex:1;padding:9px 4px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);font-weight:700;cursor:pointer;font-size:13px}
.ck .opts button.on.ok{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.ck .opts button.on.nok{background:var(--cr);border-color:var(--cr);color:#fff}
.ck .opts button.on.na{background:var(--mu);border-color:var(--mu);color:#fff}
.ck input.f{margin-top:8px;padding:8px;font-size:15px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sum div{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:10px;text-align:center}
.sum b{display:block;font-size:20px}
.sum span{font-size:11px;color:var(--mu)}
.stick{background:var(--bg);padding:10px 0 4px;margin-top:6px}
/* manutenção por equipamento */
.gh{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:10px 12px;margin:12px 0 6px;cursor:pointer}
.gh .car{width:14px;color:var(--mu);transition:transform .15s}
.gh.fe .car{transform:rotate(-90deg)}
.gh .gn{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh .gc{font-size:12px;color:var(--mu);white-space:nowrap}
.gh .ga{display:flex;gap:2px}
.gh .ga button{border:1px solid var(--ln);background:var(--bg);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:13px;padding:0}
.gb{display:grid;gap:8px;padding-left:8px;border-left:2px solid var(--ln);margin-left:6px}
.gb .grp{margin:8px 2px 2px}
.card .sel{flex:none;width:22px;height:22px;margin-top:2px;accent-color:var(--ac)}
.selbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:22;background:var(--sf);border-top:1px solid var(--ln);padding:8px 12px;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.selbar .wrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.selbar .btn{padding:8px 10px;font-size:13px}
.rn{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center;margin:6px 0}
.rn span{font-size:13px;overflow:hidden;text-overflow:ellipsis}
.rn input{padding:8px;font-size:15px}
.nb .nl{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.eqtag{flex:none;min-width:78px;font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:12.5px;color:var(--ac);background:var(--ac2);border-radius:8px;padding:6px 6px;text-align:center;align-self:flex-start}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--ln);margin:4px 4px 0 0;color:var(--mu)}.pill b{color:var(--fg)}.pill.ok{background:var(--ac2);border-color:transparent;color:var(--ac)}.pill.w{background:var(--wa2);border-color:transparent;color:var(--wa)}
.esqv{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
body.esqon{overflow:hidden}
.esqh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--ln);background:var(--sf)}
.esqh .btn{padding:7px 11px;margin:0}
.esqt{flex:1;min-width:140px;display:flex;flex-direction:column;line-height:1.2}.esqt span{font-size:12px;color:var(--mu)}
.esqn{display:flex;gap:4px;align-items:center}.esqn .f{width:62px;text-align:center;padding:7px 4px;margin:0}
.esqhits{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;align-items:center;border-bottom:1px solid var(--ln);scrollbar-width:thin}
.esqhits .note{white-space:nowrap;margin:0}.esqhits .chip{flex:none}
.esqbox{flex:1;overflow:auto;position:relative;background:#fff;touch-action:pan-x pan-y pinch-zoom}
.esqin{position:relative;width:100%}.esqin img{width:100%;display:block}
.esqmk{position:absolute;border:3px solid #e11d2a;border-radius:4px;background:rgba(255,230,0,.25);box-shadow:0 0 0 3px rgba(225,29,42,.25);animation:esqp 1.2s ease-in-out 3}
.esqmk span{position:absolute;top:-20px;left:-3px;background:#e11d2a;color:#fff;font:600 11px/1 system-ui;padding:3px 5px;border-radius:4px;white-space:nowrap}
@keyframes esqp{50%{box-shadow:0 0 0 9px rgba(225,29,42,.15)}}
.esqmsg{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;max-width:92%;text-align:center}
.esqlista{position:absolute;inset:0;top:0;background:var(--bg);overflow:auto;padding:10px;z-index:2}
.esqlh{display:flex;gap:6px;position:sticky;top:-10px;background:var(--bg);padding:6px 0;z-index:1}.esqlh .f{flex:1;margin:0}
.mini{font-size:12px;padding:3px 8px;border-radius:7px;border:1px solid var(--ln);background:var(--sf);color:var(--ac);cursor:pointer;margin-top:4px;white-space:nowrap}
.carck{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--ln);display:grid;place-items:center;font-weight:700;color:#fff;align-self:center}
.card.carsel{border-color:var(--ac);background:var(--ac2)}.card.carsel .carck{background:var(--ac);border-color:var(--ac)}
.carq{font-size:12px;color:var(--mu);margin-top:6px;display:flex;align-items:center;gap:6px}.carq .f{width:80px;padding:5px 8px;margin:0}
#print{display:none}
@media print{
  body{background:#fff!important;color:#000!important}
  #vApp,#vLogin,#sheet,#zoom,#toast,.fab,.selbar,#esqV{display:none!important}
  #print{display:block!important;font:12px/1.35 Arial,Helvetica,sans-serif;color:#000}
  #print h1{font-size:18px;margin:0 0 2px}
  #print .meta{font-size:11px;color:#333;margin-bottom:10px}
  #print table{width:100%;border-collapse:collapse;margin-top:6px}
  #print th,#print td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
  #print th{background:#e8efe9}
  #print .g td{background:#f3f3f3;font-weight:700}
  #print .nok{color:#b3261e;font-weight:700}
  #print .ass{margin-top:28px;display:flex;gap:40px}
  #print .ass div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:11px}
  @page{size:A4;margin:12mm}
}

/* ===== Identidade visual PCM · layout B4 (claro com barra preta + modo escuro automático) ===== */

html,body{font-family:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;}
h1,#ttl,.cd,.grp,.btn.p,.nl{letter-spacing:.1px}
#ttl{font-weight:800}
.hlogo{height:30px;display:block}
.login .lgimg{display:block;width:210px;margin:0 auto 22px}

:root{--bg:#f2f2f2;--sf:#ffffff;--fg:#141414;--mu:#5f5f5f;--ln:#dedede;--ac:#E35F0A;--ac2:#fdeee4;--wa:#b05a00;--wa2:#fff1e2;--cr:#c42b1c;--cr2:#fde8e6}
header{background:#141414;color:#fff;border-bottom:0;box-shadow:0 2px 0 #E35F0A}
header .st{color:#bdbdbd}
header .iconbtn{background:#262626;border-color:#333;color:#fff}
header .q{background:#262626;border-color:#333;color:#fff}
header .chip{background:#262626;border-color:#333;color:#ddd}
header .chs.l{background:linear-gradient(90deg,#141414 55%,transparent)}header .chs.r{background:linear-gradient(270deg,#141414 55%,transparent)}
nav.tabs{background:#141414;border-top:0}
.nb{color:#9a9a9a}.nb[aria-current=page]{color:#E35F0A}
.chip[aria-pressed=true]{background:#E35F0A!important;border-color:#E35F0A!important;color:#fff!important}
.btn.p{background:#E35F0A;border-color:#E35F0A}
.eqtag{background:#141414!important;color:#E35F0A!important}
.card{border-color:#e4e4e4;box-shadow:0 1px 2px rgba(0,0,0,.05)}

/* modo escuro automático (celular em modo escuro) */
@media (prefers-color-scheme:dark){
:root{--bg:#141414;--sf:#1f1f1f;--fg:#f2f2f2;--mu:#a3a3a3;--ln:#2e2e2e;--ac:#E35F0A;--ac2:#3a2414;--wa:#f0a050;--wa2:#2e2210;--cr:#ff7b6b;--cr2:#3a1a17}
header{background:#141414;border-bottom:2px solid #E35F0A}
nav.tabs{background:#0d0d0d;border-top:1px solid #2e2e2e}
.nb[aria-current=page]{color:#E35F0A}
.chip[aria-pressed=true]{background:#E35F0A!important;border-color:#E35F0A!important;color:#fff!important}
.btn.p{background:#E35F0A;border-color:#E35F0A}
.eqtag{background:#E35F0A!important;color:#141414!important}
.card{border-color:#2e2e2e}
}
.hlogo{height:30px;flex:none}
header .top>div{flex:1;margin-left:10px;min-width:0}
#ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="vLogin" class="login" hidden>
  <h1 style="margin:0"><picture><source srcset="marca/PCM-Logo-Vertical-FundoEscuro.svg" media="(prefers-color-scheme: dark)"><img class="lgimg" src="marca/PCM-Logo-Vertical-FundoClaro.svg" alt="PCM Manutenção"></picture></h1>
  <div class="box">
    <label>ID do usuário</label><input id="lgN" class="f" autocomplete="username" autocapitalize="off" spellcheck="false">
    <label>Senha</label><input id="lgP" class="f" type="password" autocomplete="current-password">
    <div class="btns"><button id="lgB" class="btn p" style="width:100%;justify-content:center">Entrar</button></div>
    <div id="lgE" class="note"></div>
  </div>
  <div class="note">O acesso é cadastrado pelo administrador. O primeiro acesso precisa de internet para baixar as peças e imagens; depois o app funciona sem sinal.</div>
  <div class="note" style="text-align:center;margin-top:22px;opacity:.75">Criado por Mel.B System</div>
</div>

<div id="vApp" hidden>
<header><div class="wrap">
  <div class="top">
    <img class="hlogo" src="marca/PCM-Logo-Horizontal-FundoEscuro.svg" alt="PCM">
    <div><h1 id="ttl">Peças</h1><div class="st"><span id="dot" class="dot"></span><span id="stx">—</span></div></div>
    <button id="syncB" class="iconbtn">↻ Sincronizar</button>
  </div>
  <input id="q" class="q" type="search" placeholder="Buscar código, descrição, tag…" autocomplete="off">
  <div id="chips" class="chips"></div>
</div></header>
<main class="wrap"><div id="view"></div></main>
<button id="fab" class="fab" hidden></button>
<nav class="tabs"><div class="wrap">
  <button class="nb" data-t="equip"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg><span class="nl">Equip.</span></button>
  <button class="nb" data-t="pecas"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span class="nl">Peças</span></button>
  <button class="nb" data-t="serras"><svg viewBox="0 0 24 24"><path d="M3 17l9-9 3 3-9 9H3z"/><path d="M14 6l2-2 4 4-2 2"/></svg><span class="nl">Serras</span></button>
  <button class="nb" data-t="manut"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span class="nl">Manut.</span></button>
  <button class="nb" data-t="check"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12l2 2 4-4M9 17h6"/></svg><span class="nl">Checklist</span></button>
  <button class="nb" data-t="led"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg><span class="nl">LED</span></button>
  <button class="nb" data-t="compras"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg><span class="nl">Compras</span></button>
  <button class="nb" data-t="mais"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><path d="M16.5 13v7M13 16.5h7"/></svg><span class="nl">Mais</span></button>

<div id="sheet" class="sheet" hidden><div id="pane" class="pane"></div></div>
<div id="zoom" class="zoom" hidden><button id="zx" class="btn x">Fechar</button><img id="zi" alt="Vista explodida"></div>
<div id="toast" class="toast" hidden></div>
<div id="print"></div>

<script src="config.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const br=iso=>iso&&/^\d{4}-\d{2}-\d{2}$/.test(iso)?iso.split('-').reverse().join('/'):iso;
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2800);}
const ls={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ---------------- IndexedDB ---------------- */
let dbp=null;
function db(){ if(dbp) return dbp; dbp=new Promise((ok,ko)=>{const r=indexedDB.open('pcm-gassen-v2',1);r.onupgradeneeded=()=>{const d=r.result;['kv','img','fila'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n);});};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);}); return dbp; }
async function idb(store,mode,fn){const d=await db();return new Promise((ok,ko)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);let res;Promise.resolve(fn(s)).then(v=>res=v);t.oncomplete=()=>ok(res);t.onerror=()=>ko(t.error);});}
const get=(st,k)=>idb(st,'readonly',s=>new Promise(ok=>{const r=s.get(k);r.onsuccess=()=>ok(r.result);}));
const put=(st,k,v)=>idb(st,'readwrite',s=>{s.put(v,k);});
const del=(st,k)=>idb(st,'readwrite',s=>{s.delete(k);});
const all=st=>idb(st,'readonly',s=>new Promise(ok=>{const out=[];const r=s.openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push([c.key,c.value]);c.continue();}else ok(out);};}));
const count=st=>idb(st,'readonly',s=>new Promise(ok=>{const r=s.count();r.onsuccess=()=>ok(r.result);}));

/* ---------------- API ---------------- */
async function api(acao,extra){
  const u=S.user||{};
  const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({acao,token:u.token},extra||{}))});
  if(!r.ok) throw new Error('Servidor respondeu '+r.status);
  const j=await r.json();
  if(!j.ok){
    const m=String(j.erro||'Erro no servidor');
    if(m.indexOf('SESSAO:')===0 && acao!=='login'){ sessaoExpirada(m.slice(7).trim()); }
    throw new Error(m.replace(/^SESSAO:\s*/,''));
  }
  return j.dados;
}
/* sessão cancelada pelo administrador (senha trocada / usuário desativado): volta ao login, mantém a fila */
function sessaoExpirada(msg){
  if(S._exp) return; S._exp=true;
  S.user=null;ls.set('pcm2_user',null);
  $('#vApp').hidden=true;$('#vLogin').hidden=false;$('#lgE').textContent=msg+(S.fila?' Seus '+S.fila+' lançamento(s) pendente(s) continuam guardados.':'');
}

/* ---------------- estado ---------------- */
if(!ls.get('pcm2_user')&&!ls.get('pcm2_saiu')){try{const u1=JSON.parse(localStorage.getItem('pcm_user'));if(u1&&u1.token)ls.set('pcm2_user',u1);}catch(e){}}
const S={user:ls.get('pcm2_user'),d:null,tab:'equip',q:'',chip:'',lim:40,img:{},fila:0,online:navigator.onLine,sync:false};
/* lembra a tela aberta: ao atualizar a página, volta para o mesmo lugar */
const TELA_K='pcm2_tela';
(function(){try{const t=ls.get(TELA_K);if(!t||!t.tab)return;const ok=['equip','pecas','serras','manut','manual','hist','check','led','compras','mais'];if(ok.indexOf(t.tab)<0)return;if(t.tab==='equip'&&!document.querySelector('.nb[data-t=equip]'))return;Object.assign(S,{tab:t.tab,mAba:t.mAba||S.mAba,chip:t.chip||'',eqSel:t.eqSel||null,eqAba:t.eqAba||S.eqAba,ckModo:t.ckModo||S.ckModo});}catch(e){}})();
function lembraTela(){ls.set(TELA_K,{tab:S.tab,mAba:S.mAba,chip:S.chip,eqSel:S.eqSel||null,eqAba:S.eqAba,ckModo:S.ckModo});}
const TIT={equip:'Equipamentos',pecas:'Peças',serras:'Serras',manut:'Manutenção',manual:'Manutenção segundo o Manual',hist:'Histórico',compras:'Compras',mais:'Mais',check:'Checklist diário',led:'Refletores LED'};

function aba(n){return (S.d&&S.d.abas&&S.d.abas[n])||{cab:[],linhas:[]};}
/* ---- nomes personalizados (aba "Config app", só o administrador altera) ---- */
const NAVROT={equip:'Equip.',pecas:'Peças',serras:'Serras',manut:'Manut.',check:'Checklist',led:'LED',compras:'Compras',mais:'Mais'};
const CFG_AB='Config app';
function cfg(k){const a=aba(CFG_AB);const r=a.linhas.find(x=>String(x[0])===k);return r?String(r[1]||''):'';}
function nomeTela(t){return cfg('aba:'+t)||TIT[t];}
function rot(c){return cfg('campo:'+String(c).trim())||c;}
function nomeFiltro(x,t){return cfg('filtro:'+(t||S.tab)+':'+x)||x;}
function isAdm(){return !!(S.user&&S.user.perfil==='administrador');}
function aplicaNomes(){document.querySelectorAll('.nb').forEach(b=>{const n=b.querySelector('.nl');if(n)n.textContent=cfg('aba:'+b.dataset.t)||NAVROT[b.dataset.t];});}
function aplicaRotulos(root){if(!root)return;root.querySelectorAll('label,.kv>b,th,.rot').forEach(el=>{if(el.children.length)return;const o=el.dataset.o||(el.dataset.o=el.textContent.trim());const n=cfg('campo:'+o);el.textContent=n||o;});}
function col(cab,...nomes){for(const n of nomes){const k=norm(n);let i=cab.findIndex(c=>norm(c)===k);if(i<0)i=cab.findIndex(c=>norm(c).startsWith(k));if(i<0)i=cab.findIndex(c=>norm(c).includes(k));if(i>=0)return i;}return -1;}
function obj(a,r){const o={};a.cab.forEach((c,i)=>o[c]=r[i]);return o;}
function v(a,r,...n){const i=col(a.cab,...n);return i>=0?r[i]:'';}
function num(x){const n=parseFloat(String(x).replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n;}

/* aplica a op no snapshot local (para o app refletir na hora, mesmo off-line) */
function aplicaLocal(op){
  if(op.tipo==='imagem'){S.img[op.imgKey]=op.b64;put('img',op.imgKey,op.b64);return;}
  if(op.tipo==='config'){if(!S.d.abas[CFG_AB])S.d.abas[CFG_AB]={cab:['Chave','Valor','Alterado por / em'],linhas:[]};const c=S.d.abas[CFG_AB];const i=c.linhas.findIndex(x=>String(x[0])===op.chave);if(op.valor===''||op.valor==null){if(i>=0)c.linhas.splice(i,1);}else if(i>=0)c.linhas[i][1]=op.valor;else c.linhas.push([op.chave,op.valor,'']);return;}
  const a=aba(op.aba); if(!a.cab.length) return;
  if(op.tipo==='excluir'){const i=a.linhas.findIndex(x=>String(x[0])===String(op.id));if(i>=0)a.linhas.splice(i,1);return;}
  if(op.tipo==='renomearValor'){const c=col(a.cab,op.coluna);if(c<0)return;a.linhas.forEach(r=>{if(String(r[c])===String(op.de))r[c]=op.para;});return;}
  if(op.tipo==='incluirLote'){(op.linhas||[]).forEach(c=>{const r=a.cab.map(()=>'');Object.keys(c).forEach(k=>{const i=col(a.cab,k);if(i>=0)r[i]=c[k];});a.linhas.push(r);});return;}
  if(op.tipo==='incluir'){const r=a.cab.map(()=>'');Object.keys(op.campos).forEach(k=>{const i=col(a.cab,k);if(i>=0)r[i]=op.campos[k];});if(!r[0])r[0]=op.campos.ID||'(novo)';a.linhas.push(r);return;}
  const r=op.idx!=null?a.linhas[op.idx]:a.linhas.find(x=>String(x[0])===String(op.id));
  if(!r) return;
  Object.keys(op.campos).forEach(k=>{const i=col(a.cab,k);if(i<0)return;r[i]=op.tipo==='somar'?String(num(r[i])+num(op.campos[k])):op.campos[k];});
}
async function enfileira(op){
  op.uid=uid();op.ts=Date.now();
  await put('fila',op.uid,op);
  aplicaLocal(op);await put('kv','dados',S.d);
  S.fila=await count('fila');status();
  if(navigator.onLine) sincroniza(false);
}

/* ---------------- sincronização ---------------- */
async function sincroniza(baixar){
  if(S.sync) return; if(!navigator.onLine){status();toast('Sem internet — os lançamentos ficam guardados');return;}
  S.sync=true;status();let okSync=false;
  try{
    const fila=(await all('fila')).map(x=>x[1]).sort((a,b)=>a.ts-b.ts);
    if(fila.length){
      for(let i=0;i<fila.length;i+=25){
        const lote=fila.slice(i,i+25).map(o=>{const c=Object.assign({},o);delete c.imgKey;delete c.idx;return c;});
        const res=await api('sync',{ops:lote});
        for(const r of res.resultados){ if(r.ok) await del('fila',r.uid); else { toast('Não gravou: '+r.erro); const o=fila.find(x=>x.uid===r.uid); if(o){o.erro=r.erro;await put('fila',o.uid,o);} } }
      }
    }
    if(baixar!==false||fila.length){ await baixaDados(); }
    S.fila=await count('fila');
    ls.set('pcm2_sync',Date.now());
    okSync=true;
  }catch(e){ toast('Falha ao sincronizar: '+e.message); }
  S.sync=false;status();render();
  // lançamentos feitos durante a sincronização: envia em seguida
  if(okSync&&navigator.onLine){const rest=(await all('fila')).filter(x=>!x[1].erro);if(rest.length)setTimeout(()=>sincroniza(false),400);}
}
async function baixaDados(){
  const d=await api('dados');
  marcaLinhas(d);
  if(d.perfil&&S.user&&S.user.perfil!==d.perfil){S.user.perfil=d.perfil;ls.set('pcm2_user',S.user);}
  // reaplica o que ainda está na fila (lançamentos que deram erro ou chegaram depois)
  S.d=d; for(const [,op] of await all('fila')) aplicaLocal(op);
  await put('kv','dados',S.d);
  baixaImagens();
}
function marcaLinhas(d){if(!d.imgApp)d.imgApp=[];}
let imgRodando=false;
async function baixaImagens(forcar){
  if(imgRodando) return; imgRodando=true;
  try{
    const tem=new Set((await all('img')).map(x=>x[0]));
    const tot=ls.get('pcm2_imgtot')||0;
    if(!forcar && tem.size>=tot && tot>0){imgRodando=false;return;}
    let desde=0;
    do{
      const r=await api('imagens',{desde,qtd:120});
      ls.set('pcm2_imgtot',r.total);
      await idb('img','readwrite',s=>{r.lista.forEach(([k,b])=>{s.put(b,k);});});
      r.lista.forEach(([k,b])=>S.img[k]=b);
      desde=r.proximo; S.imgProg=Math.min(1,(desde||r.total)/r.total); status();
      if(S.tab==='pecas'||S.tab==='serras') renderLista();
    }while(desde!==null && desde!==undefined);
  }catch(e){ toast('Imagens: '+e.message); }
  S.imgProg=null; imgRodando=false; status();
}

function status(){
  const on=navigator.onLine;
  $('#dot').className='dot'+(on?'':' off');
  const t=ls.get('pcm2_sync');
  let s=on?'On-line':'Off-line';
  if(S.sync) s='Sincronizando…';
  else if(S.fila) s+=' · '+S.fila+' lançamento'+(S.fila>1?'s':'')+' a enviar';
  else if(t) s+=' · atualizado '+new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  if(S.imgProg!=null) s+=' · imagens '+Math.round(S.imgProg*100)+'%';
  $('#stx').textContent=s;
}
addEventListener('online',()=>{status();sincroniza(true);});
addEventListener('offline',status);

/* ---------------- login ---------------- */
async function entrar(){
  const nome=$('#lgN').value.trim(),pin=$('#lgP').value;
  if(!nome||!pin){$('#lgE').textContent='Informe ID e senha.';return;}
  $('#lgB').disabled=true;$('#lgE').textContent='Entrando…';
  try{
    const u=await api('login',{usuario:nome,senha:pin});
    S.user={nome:u.usuario,perfil:u.perfil,token:u.token};S._exp=false;ls.set('pcm2_saiu',null);$('#lgP').value='';ls.set('pcm2_user',S.user);
    $('#lgE').textContent='Baixando dados da planilha…';
    await baixaDados();ls.set('pcm2_sync',Date.now());
    abreApp();
  }catch(e){S.user=null;$('#lgE').textContent=e.message.includes('Failed to fetch')?'Sem conexão com o servidor.':e.message;}
  $('#lgB').disabled=false;
}
$('#lgB').onclick=entrar;$('#lgP').onkeydown=e=>{if(e.key==='Enter')entrar();};
function sair(){if(S.fila&&!confirmar('Há lançamentos não enviados. Sair mesmo assim? Eles continuam guardados neste celular e serão enviados no próximo acesso.'))return;const t=S.user&&S.user.token;let t1=null;try{t1=(JSON.parse(localStorage.getItem('pcm_user'))||{}).token;}catch(e){}if(t&&t!==t1&&navigator.onLine)api('sair',{token:t}).catch(()=>{});S.user=null;ls.set('pcm2_user',null);ls.set('pcm2_saiu',1);setTimeout(()=>location.reload(),300);}
function confirmar(m){return window.confirm(m);}
function podeLancar(){return S.user&&S.user.perfil!=='consultar';}


/* ---------------- telas ---------------- */
function abreApp(){$('#vLogin').hidden=true;$('#vApp').hidden=false;status();render();}
document.querySelector('nav.tabs').onclick=e=>{const b=e.target.closest('.nb');if(!b)return;if(b.dataset.t!==S.tab&&b.dataset.t==='check'&&!S.ck)S.ckModo='fazer';S.mSel=null;S.eqSel=null;S.tab=b.dataset.t;S.q='';S.chip='';S.lim=40;$('#q').value='';scrollTo(0,0);render();};
$('#q').oninput=e=>{S.q=norm(e.target.value);S.lim=40;clearTimeout(render.t);render.t=setTimeout(renderLista,150);};
$('#syncB').onclick=()=>sincroniza(true);
$('#sheet').onclick=e=>{if(e.target.id==='sheet')fecha();};
function fecha(){$('#sheet').hidden=true;}
function abre(h){$('#pane').innerHTML=h;aplicaRotulos($('#pane'));$('#sheet').hidden=false;$('#pane').scrollTop=0;const f=$('#pane [data-x]');if(f)f.onclick=fecha;}

function render(){
  lembraTela();
  document.querySelectorAll('.nb').forEach(b=>b.setAttribute('aria-current',b.dataset.t===S.tab?'page':'false'));
  $('#ttl').textContent=S.tab==='equip'&&S.eqSel?'← '+S.eqSel:nomeTela(S.tab);aplicaNomes();
  $('#q').hidden=S.tab==='mais';
  const fab=$('#fab');
  const fl={manut:{corr:'+ Corretiva',prev:'+ Preventiva',led:'+ Troca',hist:'+ Registro'}[S.mAba||'corr'],hist:'+ Registro',compras:'+ Item',check:S.ckModo==='itens'?'+ Item':'',led:'+ Troca',manual:isAdm()&&!S.mSel?'+ Tarefa':''}[S.tab];
  fab.hidden=!(fl&&podeLancar());fab.textContent=fl||'';
  fab.onclick=S.tab==='manut'?(S.mAba==='led'?()=>formLed():()=>formHist({corr:'Corretiva',prev:'Preventiva'}[S.mAba||'corr'])):S.tab==='hist'?()=>formHist():S.tab==='compras'?()=>formCompra():S.tab==='check'?()=>formCkItem():S.tab==='led'?()=>formLed():S.tab==='manual'?()=>formTarefa():null;
  chips();renderLista();
}
function chips(){
  let c=[];
  if(S.tab==='pecas'){const a=aba('Peças');const set=new Set();a.linhas.forEach(r=>{const t=v(a,r,'Tipo');if(t)set.add(t);});c=[...set].concat(['A comprar']);}
  if(S.tab==='serras'){const a=aba('manuais_pecas');const set=[];a.linhas.forEach(r=>{const t=v(a,r,'Aba origem');if(t&&set.indexOf(t)<0)set.push(t);});c=set;}
  if(S.tab==='manual'){c=['Atrasada','Vence','Em dia'];const a=aba('Manutenção');const set=new Set();a.linhas.forEach(r=>{const t=v(a,r,'Área','Tipo');if(t)set.add(t);});c=c.concat([...set]);}
  if(S.tab==='compras'){c=['A pedir','Pedido','Recebido','Cancelado'];}
  if(S.tab==='check'){const set=[];aba('Checklist itens').linhas.forEach(r=>{const e=v(aba('Checklist itens'),r,'Equipamento');if(e&&set.indexOf(e)<0)set.push(e);});c=set.sort();}
  if(S.tab==='led'){c=ledMeses();}
  if(S.tab==='manut'){c=manutMeses();}
  if(S.tab==='equip'&&!S.eqSel){c=areasEq();}
  $('#chips').hidden=!c.length;
  const edF=isAdm()&&podeLancar()&&c.length&&['pecas','serras','manual','check','equip'].includes(S.tab);
  $('#chips').innerHTML=['<button class="chip" data-c="" aria-pressed="'+(!S.chip)+'">Todos</button>'].concat(c.map(x=>'<button class="chip" data-c="'+esc(x)+'" aria-pressed="'+(S.chip===x)+'">'+esc(nomeFiltro(x))+'</button>')).join('')+(edF?'<button class="chip" id="chEd" title="Renomear filtros">✏️ Renomear</button>':'');
  ligaChips();setas();
  $('#chips').onclick=e=>{if(e.target.closest('#chEd')){formFiltros(c);return;}const b=e.target.closest('.chip');if(!b)return;S.chip=b.dataset.c;lembraTela();S.lim=40;chips();renderLista();};
}
/* barra de filtros: setas, arrastar com o mouse e roda do mouse */
function setas(){const ce=$('#chips');const w=ce&&ce.parentNode;if(!w||!w.classList.contains('chipw'))return;const l=w.querySelector('.chs.l'),r=w.querySelector('.chs.r');const sobra=ce.scrollWidth-ce.clientWidth;const vis=!ce.hidden&&sobra>4;l.hidden=!vis||ce.scrollLeft<=4;r.hidden=!vis||ce.scrollLeft>=sobra-4;}
function ligaChips(){
  const ce=$('#chips');if(!ce||ce.dataset.lig)return;ce.dataset.lig=1;
  const w=document.createElement('div');w.className='chipw';ce.parentNode.insertBefore(w,ce);w.appendChild(ce);
  const mk=(c,t,d)=>{const b=document.createElement('button');b.className='chs '+c;b.type='button';b.textContent=t;b.setAttribute('aria-label',d>0?'Mais filtros à direita':'Mais filtros à esquerda');b.hidden=true;b.onclick=e=>{e.stopPropagation();ce.scrollBy({left:d*Math.max(160,ce.clientWidth*0.7),behavior:'smooth'});};w.appendChild(b);};
  mk('l','‹',-1);mk('r','›',1);
  ce.addEventListener('scroll',setas,{passive:true});addEventListener('resize',setas);
  ce.addEventListener('wheel',e=>{if(ce.scrollWidth>ce.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){ce.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
  let x0=0,s0=0,ativo=false,moveu=false;
  ce.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.button!==0)return;ativo=true;moveu=false;x0=e.clientX;s0=ce.scrollLeft;});
  addEventListener('pointermove',e=>{if(!ativo)return;const dx=e.clientX-x0;if(!moveu&&Math.abs(dx)>5){moveu=true;ce.classList.add('arr');}if(moveu){ce.scrollLeft=s0-dx;e.preventDefault();}});
  addEventListener('pointerup',()=>{if(!ativo)return;ativo=false;ce.classList.remove('arr');if(moveu)setTimeout(()=>moveu=false,0);});
  ce.addEventListener('click',e=>{if(moveu){e.stopPropagation();e.preventDefault();moveu=false;}},true);
  ce.addEventListener('dragstart',e=>e.preventDefault());
}
const busca=(txt)=>!S.q||norm(txt).includes(S.q);
function imgDe(id){return S.img[id];}
function thumb(key){const b=key&&imgDe(key);return '<div class="th">'+(b?'<img loading="lazy" src="data:image/jpeg;base64,'+b+'" alt="">':(key?'…':'sem<br>imagem'))+'</div>';}
function mais(n){return n>S.lim?'<button class="more" id="mais">Mostrar mais ('+(n-S.lim)+')</button>':'';}
function ligaMais(){const m=$('#mais');if(m)m.onclick=()=>{S.lim+=40;renderLista();};}

function renderLista(){
  const V=$('#view');
  if(!S.d){V.innerHTML='<div class="empty">Sem dados. Toque em ↻ Sincronizar com internet.</div>';return;}

const ED_FORA=/^(id|imagem id|precisao da imagem|estoque atual|comprar)$/;
function editarLinha(nAba,r,opBase,titulo,depois){

  const iD=col(a.cab,'Descrição');

  abre('<div class="ph"><b>Editar '+esc(titulo)+'</b><button class="lnk" data-x>Fechar</button></div>'+
    cols.map(([c,i])=>'<label>'+esc(c)+'</label>'+(longo(c)?'<textarea class="f" data-i="'+i+'">'+esc(r[i])+'</textarea>':'<input class="f" data-i="'+i+'" value="'+esc(r[i])+'">')).join('')+
    '<div class="btns" style="position:sticky;bottom:0;background:var(--sf);padding:8px 0"><button class="btn p" id="edS">Salvar alterações</button></div><div class="note">Campos calculados pela planilha (fórmulas) não são alterados.</div>');
  $('#edS').onclick=async()=>{
    const campos={};$('#pane').querySelectorAll('[data-i]').forEach(el=>{const i=+el.dataset.i;const nv=el.value.trim();if(nv!==String(r[i]==null?'':r[i]).trim())campos[a.cab[i]]=nv;});
    if(!Object.keys(campos).length){toast('Nada alterado');fecha();return;}
    if(iD>=0&&a.cab[iD] in campos&&!campos[a.cab[iD]]){toast('A descrição não pode ficar vazia');return;}

function reduz(file){return new Promise((ok,ko)=>{const fr=new FileReader();fr.onerror=()=>ko(new Error('Não consegui ler a foto'));fr.onload=()=>{const im=new Image();im.onerror=()=>ko(new Error('Formato não suportado'));im.onload=()=>{let w=520,q=.78;for(let i=0;i<10;i++){const s=Math.min(1,w/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);const o=c.toDataURL('image/jpeg',q).split(',')[1];if(o.length<45000)return ok(o);w*=.82;q=Math.max(.5,q-.05);}ko(new Error('Foto grande demais'));};im.src=fr.result;};fr.readAsDataURL(file);});}

/* ================= EQUIPAMENTOS POR SETOR/TAG (integração planta elétrica) ================= */
const EQ_AB='Equip. planta',IT_AB='Itens elétricos';
const FAMI={MI:'Motor (inversor)',MD:'Motor (partida direta)',MS:'Motobomba',FM:'Freio do motor',EN:'Encoder',SI:'Sensor indutivo',SE:'Sensor óptico emissor',SR:'Sensor óptico receptor',SF:'Sensor óptico difuso',SC:'Fim de curso / microswitch',SM:'Sensor magnético de segurança',SS:'Sensor de monitoramento',SP:'Sensor de pressão',SN:'Sensor de nível',BC:'Botoeira de comando',BE:'Botoeira de emergência',BP:'Botoeira de parada',BR:'Botoeira de reset',VS:'Válvula solenoide',VA:'Válvula solenoide',VR:'Válvula solenoide',EI:'Eletroímã',TV:'Trava de segurança',CS:'Corda de segurança',CL:'Coluna sonora / sinaleiro',QC:'Quadro elétrico',QR:'Quadro remoto / cabo',RE:'Antena wireless',AT:'Alimentação'};

function famItem(tag,desc,f){if(f)return f;const p=(String(tag).match(/^[A-Z]+/)||[''])[0];return FAMI[p]||(/QUADRO/i.test(desc)?'Quadro elétrico':'Outros');}
function grupoFam(f){if(/^Motor|Motobomba|Freio|Encoder/.test(f))return 'Motores';if(/^Botoeira/.test(f))return 'Botoeiras';if(/Válvula|Eletroímã/.test(f))return 'Válvulas';if(/^Sensor|Fim de curso|Trava|Corda/.test(f))return 'Sensores e segurança';return 'Outros';}
const AREA_NOME={GER:'Geral · quadros e auxiliares',ZSB:'Zona suja',ZLB:'Zona limpa'};
const areaDe=setor=>setor?(String(setor).match(/^[A-Z]+/)||['Outros'])[0]:'A definir';
function equipLista(){
  const a=aba(EQ_AB),it=aba(IT_AB);
  const E=a.linhas.map(r=>({id:String(r[0]),setor:v(a,r,'Setor / TAG'),nome:v(a,r,'Equipamento'),modelo:v(a,r,'Modelo'),of:v(a,r,'OF'),qtd:v(a,r,'Qtd'),origem:v(a,r,'Origem'),manual:v(a,r,'Manual'),local:v(a,r,'Área / local'),obs:v(a,r,'Observação'),r,itens:[]}));
  const porId={};E.forEach(e=>porId[e.id]=e);
  it.linhas.forEach(r=>{const e=porId[String(v(it,r,'Equip. ID'))];if(!e)return;const tag=v(it,r,'TAG'),desc=v(it,r,'Descrição');const f=famItem(tag,desc,v(it,r,'Família'));e.itens.push({id:String(r[0]),tag,desc,fam:f,grp:grupoFam(f),kw:v(it,r,'Pot.'),lig:v(it,r,'Ligação'),vias:v(it,r,'Vias'),quadro:v(it,r,'Quadro'),cod:v(it,r,'Código'),local:v(it,r,'Local físico'),est:v(it,r,'Estoque'),obs:v(it,r,'Observação'),r});});

function areasEq(){const set=[];equipLista().forEach(e=>{const x=areaDe(e.setor);if(set.indexOf(x)<0)set.push(x);});const o=['GER','ZSB','ZLB'];return set.sort((a,b)=>{const i=o.indexOf(a),j=o.indexOf(b);return ((i<0?(a==='A definir'?99:9):i)-(j<0?(b==='A definir'?99:9):j))||a.localeCompare(b);});}
const codDig=c=>String(c||'').replace(/\D/g,'');
function ligacoes(e){
  const p=aba('Peças'),m=aba(MN),mo=aba('Motores');
  const pecas=new Map();const quadro=/quadro principal/i.test(e.nome);
  const porCod={};p.linhas.forEach(r=>{const c=codDig(v(p,r,'Código'));if(c)(porCod[c]=porCod[c]||[]).push(r);});
  if(e.setor)p.linhas.forEach(r=>{const q=norm(v(p,r,'Equipamento'));if(q===norm(e.setor)||(quadro&&q==='quadro'))pecas.set(r[0],r);});
  e.itens.forEach(i=>{i.pecas=porCod[codDig(i.cod)]||[];i.pecas.forEach(r=>pecas.set(r[0],r));const mr=mo.linhas.find(x=>String(x[0]).trim()===i.tag);i.motor=mr?{pot:v(mo,mr,'Potência'),acion:v(mo,mr,'Acionamento'),modelo:v(mo,mr,'Modelo'),disj:v(mo,mr,'Disjuntor'),freio:v(mo,mr,'Freio')}:null;});
  const tarefas=e.setor?m.linhas.filter(r=>norm(v(m,r,'Equipamento'))===norm(e.setor)):[];
  const man=e.manual?aba('manuais_pecas').linhas.filter(r=>v(aba('manuais_pecas'),r,'Aba origem')===e.manual):[];
  return {pecas:[...pecas.values()],tarefas,man};

  grupos.forEach(([e,G],gi)=>{
    const atr=G.filter(r=>stTarefa(a,r)[0]==='Atrasada').length,ven=G.filter(r=>stTarefa(a,r)[0]==='Vence').length;

      (adm&&e!==SEM_EQ?'<span class="ga"><button data-up="'+gi+'" title="Subir">↑</button><button data-dn="'+gi+'" title="Descer">↓</button><button data-rn="'+esc(e)+'" title="Renomear">✏️</button></span>':'')+'</div>';
    if(!aberto) return;
    const tipos=[];G.forEach(r=>{const t=v(a,r,'Tipo','Área')||'Outros';if(tipos.indexOf(t)<0)tipos.push(t);});
    tipos.sort((x,y)=>{const i=TIPO_ORD.indexOf(x),j=TIPO_ORD.indexOf(y);return ((i<0?99:i)-(j<0?99:j))||x.localeCompare(y,'pt');});
    h+='<div class="gb">'+tipos.map(t=>{const T=G.filter(r=>(v(a,r,'Tipo','Área')||'Outros')===t).sort((x,y)=>(ordem[stTarefa(a,x)[0]]??2)-(ordem[stTarefa(a,y)[0]]??2));
      return '<div class="grp">'+esc(t)+' · '+T.length+'</div>'+T.map(r=>{const st=stTarefa(a,r);const id=String(r[0]);
        return '<div class="card" data-t="'+esc(id)+'">'+(sel?'<input type="checkbox" class="sel" data-s="'+esc(id)+'"'+(sel.has(id)?' checked':'')+'>':'')+'<div class="ci"><div class="cd">'+esc(v(a,r,'Tarefa','Atividade','Descrição'))+'</div><div class="cm">'+esc(id)+' · '+esc(v(a,r,'Periodicidade','Frequência'))+(v(a,r,'Grupo')?' · '+esc(v(a,r,'Grupo')):'')+'</div><div class="cm">Última: '+esc(br(v(a,r,'Última'))||'—')+' · Próxima: '+esc(br(v(a,r,'Próxima'))||'—')+'</div></div><div class="rt"><span class="tag '+st[1]+'">'+esc(st[0])+'</span></div></div>';}).join('');}).join('')+'</div>';
  });
  V.innerHTML='<div class="btns" style="margin-top:8px"><button class="btn" id="mVolta">← Voltar para Mais</button></div>'+h;
  $('#mVolta').onclick=()=>{S.mSel=null;S.tab='mais';S.q='';S.chip='';$('#q').value='';render();};
  $('#mTg').onclick=()=>{setFechados(fe.size?new Set():new Set(eqs));renderLista();};
  if(adm)$('#mSl').onclick=()=>{S.mSel=sel?null:new Set();render();};
  V.onclick=e=>{
    const b=e.target.closest('button');
    if(b&&b.dataset.up!=null){e.stopPropagation();moveEq(grupos.map(g=>g[0]),+b.dataset.up,-1);return;}
    if(b&&b.dataset.dn!=null){e.stopPropagation();moveEq(grupos.map(g=>g[0]),+b.dataset.dn,1);return;}
    if(b&&b.dataset.rn!=null){e.stopPropagation();renomearEq(b.dataset.rn);return;}
    const g=e.target.closest('.gh');if(g&&!b){const f=fechados();f.has(g.dataset.g)?f.delete(g.dataset.g):f.add(g.dataset.g);setFechados(f);renderLista();return;}
    const c=e.target.closest('[data-t]');if(!c)return;
    if(sel){const id=c.dataset.t;sel.has(id)?sel.delete(id):sel.add(id);const cb=c.querySelector('.sel');if(cb)cb.checked=sel.has(id);barraSel();return;}
    detTarefa(c.dataset.t);
  };
  barraSel();
}
function barraSel(){

function dlEquip(id){return '<datalist id="'+id+'">'+todosEquip().map(e=>'<option value="'+esc(e)+'">').join('')+'</datalist>';}
function destinoEq(modo,ids){
  abre('<div class="ph"><b>'+(modo==='mover'?'Mover':'Copiar')+' '+ids.length+' tarefa'+(ids.length===1?'':'s')+'</b><button class="lnk" data-x>Fechar</button></div>'+
    '<label>Equipamento</label><input id="dE" class="f" list="dlE" placeholder="Escolha ou digite um novo">'+dlEquip('dlE')+
    '<div class="note">'+(modo==='mover'?'As tarefas passam para o equipamento escolhido (o histórico de execuções continua).':'Cria uma cópia de cada tarefa no equipamento escolhido, com ID novo e sem data de execução.')+'</div>'+
    '<div class="btns"><button class="btn p" id="dS">'+(modo==='mover'?'Mover':'Copiar')+'</button></div>');
  $('#dS').onclick=async()=>{
    const eq=$('#dE').value.trim();if(!eq){toast('Informe o equipamento');return;}
    if(modo==='mover') await moverTarefas(ids,eq); else await copiarTarefas(ids,eq);
    S.mSel=null;fecha();render();
  };

async function moverTarefas(ids,eq){
  const a=aba(MN),ce=hdr(a,'Equipamento');
  for(const id of ids) await enfileira({tipo:'atualizar',aba:MN,id,campos:{[ce]:eq}});
  toast(ids.length+' tarefa(s) movida(s) para '+eq);
}
const MN_NAO_COPIAR=['ID','Última execução','Próxima','Status','Responsável'];
async function copiarTarefas(ids,eq){
  const a=aba(MN);const ce=hdr(a,'Equipamento');
  const rows=ids.map(id=>a.linhas.find(x=>String(x[0])===String(id))).filter(Boolean);
  for(let k=0;k<rows.length;k++){
    const r=rows[k],campos={};
    a.cab.forEach((c,i)=>{if(r[i]===''||MN_NAO_COPIAR.some(n=>norm(c).startsWith(norm(n))))return;campos[c]=r[i];});
    campos[ce]=eq;campos[a.cab[0]]=proxIdMN();
    await enfileira({tipo:'incluir',aba:MN,prefixo:'MP',campos});
  }
  toast(rows.length+' tarefa(s) copiada(s) para '+eq);
}
async function moveEq(lista,i,d){
  const j=i+d;if(j<0||j>=lista.length)return;
  const todos=eqsManut();const o=lista.slice();[o[i],o[j]]=[o[j],o[i]];
  const resto=todos.filter(x=>o.indexOf(x)<0);
  await enfileira({tipo:'config',chave:'ordem:'+MN,valor:JSON.stringify(o.concat(resto).filter(x=>x!==SEM_EQ))});
  renderLista();
}

/* cadastrar / editar tarefa (administrador) */
function formTarefa(id){
  const a=aba(MN);const r=id?a.linhas.find(x=>String(x[0])===String(id)):null;
  const val=n=>r?v(a,r,n):'';
  const uniq=n=>[...new Set(a.linhas.map(x=>v(a,x,n)).filter(Boolean))].sort((x,y)=>x.localeCompare(y,'pt'));
  const tipos=[...new Set(TIPO_ORD.concat(uniq('Tipo')))];
  const eqPre=r?val('Equipamento'):(S.mUlt||'');
  const F=[['Equipamento','fE','list:dlE2'],['Tipo','fT','sel'],['Grupo','fG','list:dlG'],['Tarefa','fX','area'],['Periodicidade','fP','list:dlP'],['Dias','fD','num'],['Responsável','fR',''],['Observação','fO','area']];
  const campo=([n,k,t])=>{const lab='<label>'+esc(hdr(a,n))+'</label>';const vv=n==='Equipamento'?eqPre:val(n);
    if(t==='sel')return lab+'<select id="'+k+'" class="f">'+tipos.map(x=>'<option'+(x===vv?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select>';
    if(t==='area')return lab+'<textarea id="'+k+'" class="f">'+esc(vv)+'</textarea>';
    if(t==='num')return lab+'<input id="'+k+'" class="f" inputmode="numeric" value="'+esc(vv)+'">';
    if(t.startsWith('list:'))return lab+'<input id="'+k+'" class="f" list="'+t.slice(5)+'" value="'+esc(vv)+'">';
    return lab+'<input id="'+k+'" class="f" value="'+esc(vv)+'">';};
  abre('<div class="ph"><b>'+(r?'Editar tarefa '+esc(id):'Nova tarefa')+'</b><button class="lnk" data-x>Fechar</button></div>'+F.map(campo).join('')+
    dlEquip('dlE2')+'<datalist id="dlG">'+uniq('Grupo').map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist><datalist id="dlP">'+uniq('Periodicidade').map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>'+
    '<div class="btns"><button class="btn p" id="fS">'+(r?'Salvar':'Adicionar')+'</button>'+(r?'':'<button class="btn" id="fS2">Adicionar e cadastrar outra</button>')+'</div><div class="note">"Próxima" e "Status" são calculados pela planilha.</div>');
  const salvar=async(outra)=>{
    const novo={};F.forEach(([n,k])=>{novo[n]=$('#'+k).value.trim();});
    if(!novo.Equipamento||!novo.Tarefa){toast('Informe equipamento e tarefa');return;}
    if(novo.Dias&&isNaN(num(novo.Dias))){toast('Dias deve ser um número');return;}
    S.mUlt=novo.Equipamento;
    if(r){const campos={};F.forEach(([n])=>{if(novo[n]!==String(val(n)))campos[hdr(a,n)]=n==='Dias'&&novo[n]?num(novo[n]):novo[n];});
      if(!Object.keys(campos).length){fecha();return;}
      await enfileira({tipo:'atualizar',aba:MN,id,campos});toast('Tarefa atualizada');}
    else{const campos={[a.cab[0]||'ID']:proxIdMN()};F.forEach(([n])=>{if(novo[n]!=='')campos[hdr(a,n)]=n==='Dias'?num(novo[n]):novo[n];});
      await enfileira({tipo:'incluir',aba:MN,prefixo:'MP',campos});toast('Tarefa '+campos[a.cab[0]||'ID']+' adicionada');}
    if(outra){formTarefa();$('#fX').focus();}else{fecha();}
    renderLista();
  };
  $('#fS').onclick=()=>salvar(false);
  if(!r)$('#fS2').onclick=()=>salvar(true);
}
/* mapeia campos lógicos para os cabeçalhos reais do Histórico */
function histCampos(o){
  const h=aba('Histórico').cab,out={};
  const set=(nomes,val)=>{if(val===''||val==null)return;const i=col(h,...nomes);if(i>=0)out[h[i]]=val;};
  set(['Data'],o.data);set(['Tipo'],o.tipo);set(['Equipamento'],o.equip);set(['Área'],o.area);
  set(['Tarefa','ID tarefa'],o.tarefa);set(['Defeito','Descrição','Serviço'],o.desc);set(['Ação'],o.acao);
  set(['Peças'],o.pecas);set(['Tempo parado','Tempo'],o.tempo);set(['Responsável','Executante','Técnico'],S.user.nome);set(['Obs'],o.obs);
  return out;
}

/* ================= COMPRAS + CARRINHO (seleção manual → PDF para o financeiro) ================= */
const CAR_K=(location.pathname.indexOf('/v2/')>=0?'pcm2':'pcm')+'_carrinho';
function carGet(){return ls.get(CAR_K)||{};}
function carSet(o){ls.set(CAR_K,o);}
function carChave(a,r){return [v(a,r,'ID peça','ID'),v(a,r,'Código'),v(a,r,'Descrição'),v(a,r,'Data')].join('|');}
/* código e descrição: da própria linha de Compras; se faltar, busca na peça (Peças / Serras) */
function carPeca(a,r){
  let cod=v(a,r,'Código'),desc=v(a,r,'Descrição');const pid=v(a,r,'ID peça','ID');
  if(pid&&(!cod||!desc)){const ab=/^M\d+$/.test(pid)?'manuais_pecas':'Peças';const pa=aba(ab);const pr=pa.linhas.find(x=>String(x[0])===String(pid));if(pr){cod=cod||v(pa,pr,'Código');desc=desc||v(pa,pr,'Descrição');}}
  return {cod:cod&&cod!=='—'?cod:'',desc,pid};
}
function lCompras(V){
  const a=aba('Compras');const car=carGet();
  const chaves=new Set(a.linhas.map(r=>carChave(a,r)));
  Object.keys(car).forEach(k=>{if(!chaves.has(k))delete car[k];});carSet(car);   // tira do carrinho o que saiu da planilha
  if(S.recModo){lRecebe(V,a);return;}
  const modo=!!S.carModo;
  const L=a.linhas.map((r,i)=>[r,i]).filter(([r])=>(!S.chip||v(a,r,'Status')===S.chip)&&busca(r.join(' ')));
  const nSel=Object.keys(car).length;
  V.innerHTML='<div class="bar"><span>'+L.length+' itens</span><span class="btns" style="margin:0;gap:6px">'+
      (modo?'<button class="btn" id="carTodos">Marcar todos "A pedir"</button><button class="btn p" id="carSair">✓ Concluir seleção</button>':(podeLancar()&&a.linhas.some(r=>v(a,r,'Status')==='Pedido')?'<button class="btn" id="recAbre">📦 Conferir recebimento ('+a.linhas.filter(r=>v(a,r,'Status')==='Pedido').length+')</button>':'')+'<button class="btn p" id="carAbre">🛒 Carrinho'+(nSel?' ('+nSel+')':'')+'</button>')+'</span></div>'+
    (modo?'<div class="note" style="margin:0 0 8px">Toque nos itens para colocar ou tirar do carrinho. Ajuste a quantidade se precisar e gere o PDF para o financeiro.</div>':'')+
    '<div class="list">'+L.slice(0,S.lim).map(([r,i])=>{const st=v(a,r,'Status');const k=carChave(a,r);const sel=car[k]!=null;const pc=carPeca(a,r);
    return '<button class="card'+(sel?' carsel':'')+'" data-c="'+i+'">'+(modo||sel?'<div class="carck">'+(sel?'✓':'')+'</div>':'')+'<div class="ci"><div class="cd">'+esc(pc.desc)+'</div><div class="cc">'+esc(pc.cod||'sem código')+'</div><div class="cm">'+esc(v(a,r,'Loja'))+' · '+esc(br(v(a,r,'Data')))+'</div>'+
      (modo&&sel?'<div class="carq" data-q="'+i+'">Qtd no pedido: <input class="f" inputmode="decimal" value="'+esc(car[k])+'"></div>':'')+

  const lista=V.querySelector('.list');
  lista.onclick=e=>{
    if(e.target.closest('.carq'))return;
    const c=e.target.closest('[data-c]');if(!c)return;const i=+c.dataset.c;
    if(!S.carModo){detCompra(i);return;}
    const r=a.linhas[i];const k=carChave(a,r);const o=carGet();
    if(o[k]!=null)delete o[k];else o[k]=v(a,r,'Qtd')||'1';
    carSet(o);const y=scrollY;render();scrollTo(0,y);
  };

  const sa=$('#carSair');if(sa)sa.onclick=()=>{S.carModo=false;render();};
  const ra=$('#recAbre');if(ra)ra.onclick=()=>{S.recModo=true;S.carModo=false;S.chip='Pedido';S.rec={};render();};
  const to=$('#carTodos');if(to)to.onclick=()=>{const o=carGet();a.linhas.forEach(r=>{if(v(a,r,'Status')==='A pedir'){const k=carChave(a,r);if(o[k]==null)o[k]=v(a,r,'Qtd')||'1';}});carSet(o);render();};

}
/* ---------- conferência de recebimento (itens "Pedido") ---------- */
function recPecaDe(a,r){                      // aba + ID da peça para somar no estoque
  let pid=v(a,r,'ID peça','ID');const cod=v(a,r,'Código');
  if(pid){const ab=/^M\d+$/.test(pid)?'manuais_pecas':'Peças';if(aba(ab).linhas.some(x=>String(x[0])===String(pid)))return {ab,pid};}
  if(cod){for(const ab of ['Peças','manuais_pecas']){const pa=aba(ab);const pr=pa.linhas.find(x=>norm(v(pa,x,'Código'))===norm(cod));if(pr)return {ab,pid:String(pr[0])};}}
  return null;
}
function lRecebe(V,a){
  if(!S.rec)S.rec={};
  const L=a.linhas.map((r,i)=>[r,i]).filter(([r])=>v(a,r,'Status')==='Pedido'&&busca(r.join(' ')));
  V.innerHTML='<div class="bar"><span>'+L.length+' itens pedidos</span><span class="btns" style="margin:0;gap:6px"><button class="btn" id="recTodos">Marcar todos como chegou</button><button class="btn" id="recSair">Cancelar</button></span></div>'+
    '<div class="note" style="margin:0 0 8px">Confira cada item que chegou: marque ✓ e confirme a quantidade recebida. Ao confirmar, o status vira <b>Recebido</b> e o estoque da peça é somado automaticamente. Se chegar menos que o pedido, o restante continua como <b>Pedido</b>.</div>'+
    (L.length?'<div class="list">'+L.map(([r,i])=>{const pc=carPeca(a,r);const sel=S.rec[i]!=null;const alvo=recPecaDe(a,r);
      return '<div class="card'+(sel?' carsel':'')+'" data-r="'+i+'" style="cursor:pointer"><div class="carck">'+(sel?'✓':'')+'</div><div class="ci"><div class="cd">'+esc(pc.desc)+'</div><div class="cc">'+esc(pc.cod||'sem código')+'</div><div class="cm">Pedido: <b>'+esc(v(a,r,'Qtd'))+'</b> · '+esc(v(a,r,'Loja')||'—')+(alvo?' · estoque atual '+esc(v(aba(alvo.ab),aba(alvo.ab).linhas.find(x=>String(x[0])===alvo.pid),'Estoque atual')||'0'):' · <span style="color:var(--cr)">peça não cadastrada (estoque não será somado)</span>')+'</div>'+
        (sel?'<div class="carq" data-q="'+i+'">Qtd recebida: <input class="f" inputmode="decimal" value="'+esc(S.rec[i])+'"></div>':'')+'</div></div>';}).join('')+'</div>'
      :'<div class="empty">Nenhum item com status "Pedido".</div>');
  const lista=V.querySelector('.list');
  if(lista){
    lista.onclick=e=>{if(e.target.closest('.carq'))return;const c=e.target.closest('[data-r]');if(!c)return;const i=+c.dataset.r;if(S.rec[i]!=null)delete S.rec[i];else S.rec[i]=v(a,a.linhas[i],'Qtd')||'1';const y=scrollY;render();scrollTo(0,y);};
    lista.oninput=e=>{const q=e.target.closest('.carq');if(q)S.rec[+q.dataset.q]=e.target.value;};
  }
  $('#recTodos').onclick=()=>{L.forEach(([r,i])=>{if(S.rec[i]==null)S.rec[i]=v(a,r,'Qtd')||'1';});render();};
  $('#recSair').onclick=()=>{S.recModo=false;S.rec={};render();};
  recBarra(a);
}
function recBarra(a){
  let b=$('#recbar');const n=Object.keys(S.rec||{}).length;
  const cb=$('#carbar');if(cb)cb.remove();
  if(!S.recModo||!n){if(b)b.remove();document.body.classList.remove('comsel');return;}
  if(!b){b=document.createElement('div');b.id='recbar';b.className='selbar';document.body.appendChild(b);}
  document.body.classList.add('comsel');
  b.innerHTML='<div class="wrap"><b>📦 '+n+(n>1?' itens conferidos':' item conferido')+'</b><span style="flex:1"></span><button class="btn p" id="rbOk">✓ Confirmar recebimento</button></div>';
  $('#rbOk').onclick=()=>confirmaRecebe(a);
}
async function confirmaRecebe(a){
  const its=Object.keys(S.rec).map(Number).map(i=>({i,r:a.linhas[i],q:num(S.rec[i])})).filter(x=>x.r&&v(a,x.r,'Status')==='Pedido');
  const ruins=its.filter(x=>!(x.q>0));if(ruins.length){toast('Informe a quantidade recebida de todos os itens marcados');return;}
  const linhas=its.map(x=>{const pc=carPeca(a,x.r);const ped=num(v(a,x.r,'Qtd'));const alvo=recPecaDe(a,x.r);return '• '+(pc.cod||'s/ código')+' — '+x.q+(x.q<ped?' de '+ped+' (parcial)':'')+(alvo?'':' (sem peça p/ estoque)');});
  if(!confirmar('Confirmar o recebimento destes itens?\n\n'+linhas.join('\n')+'\n\nO status vai para "Recebido" (nos parciais o restante continua "Pedido") e o estoque das peças será somado.'))return;
  const hojeBr=new Date().toLocaleDateString('pt-BR');let est=0,sem=0;
  for(const x of its){
    const r=x.r,i=x.i;const ped=num(v(a,r,'Qtd'));const parcial=x.q<ped;
    const conferir={};const ip=col(a.cab,'ID peça','ID');const ic=col(a.cab,'Código');if(ip>=0)conferir[a.cab[ip]]=r[ip];if(ic>=0)conferir[a.cab[ic]]=r[ic];
    const obs=[v(a,r,'Observação'),'Recebido '+x.q+(parcial?' de '+ped:'')+' em '+hojeBr+' por '+S.user.nome].filter(Boolean).join(' · ');
    const campos=parcial?{Qtd:String(ped-x.q),Observação:obs}:{Status:'Recebido',Observação:obs};
    await enfileira({tipo:'atualizar',aba:'Compras',linha:aCompraLinha(i),idx:i,conferir,campos});
    const alvo=recPecaDe(a,r);
    if(alvo){await enfileira({tipo:'somar',aba:alvo.ab,id:alvo.pid,campos:{'Estoque atual':x.q}});est++;}else sem++;
  }
  S.recModo=false;S.rec={};
  toast(its.length+' item(ns) recebido(s) · estoque atualizado em '+est+' peça(s)'+(sem?' · '+sem+' sem peça cadastrada':''));
  renderLista();
}
function carBarra(){
  if(S.recModo)return;
  let b=$('#carbar');const n=Object.keys(carGet()).length;
  if(S.tab!=='compras'||!n){if(b)b.remove();if(!$('#selbar'))document.body.classList.remove('comsel');return;}
  if(!b){b=document.createElement('div');b.id='carbar';b.className='selbar';document.body.appendChild(b);}
  document.body.classList.add('comsel');
  b.innerHTML='<div class="wrap"><b>🛒 '+n+(n>1?' itens':' item')+' no carrinho</b><span style="flex:1"></span><button class="btn" id="cbLimpa">Limpar</button>'+(podeLancar()?'<button class="btn" id="cbPed">Marcar como "Pedido"</button>':'')+'<button class="btn p" id="cbPdf">📄 Gerar PDF</button></div>';
  $('#cbLimpa').onclick=()=>{if(!confirmar('Tirar todos os itens do carrinho?'))return;carSet({});render();};
  $('#cbPdf').onclick=pdfCarrinho;
  const pe=$('#cbPed');if(pe)pe.onclick=async()=>{
    const a=aba('Compras');const o=carGet();const its=a.linhas.map((r,i)=>[r,i]).filter(([r])=>o[carChave(a,r)]!=null);
    if(!confirmar('Marcar os '+its.length+' itens do carrinho como "Pedido" na planilha e esvaziar o carrinho?'))return;
    for(const [r,i] of its){if(v(a,r,'Status')==='Pedido')continue;const conferir={};const ip=col(a.cab,'ID peça','ID');const ic=col(a.cab,'Código');if(ip>=0)conferir[a.cab[ip]]=r[ip];if(ic>=0)conferir[a.cab[ic]]=r[ic];
      await enfileira({tipo:'atualizar',aba:'Compras',linha:aCompraLinha(i),idx:i,conferir,campos:{Status:'Pedido',Qtd:String(o[carChave(a,r)]||v(a,r,'Qtd'))}});}
    carSet({});S.carModo=false;toast(its.length+' itens marcados como Pedido');renderLista();
  };
}
function pdfCarrinho(){
  const a=aba('Compras');const o=carGet();

  if(!its.length){toast('O carrinho está vazio');return;}

  const agora=new Date();const num='CC-'+agora.getFullYear()+String(agora.getMonth()+1).padStart(2,'0')+String(agora.getDate()).padStart(2,'0')+'-'+String(agora.getHours()).padStart(2,'0')+String(agora.getMinutes()).padStart(2,'0');
  $('#print').innerHTML='<h1>Solicitação de compra · '+esc(num)+'</h1><div class="meta">PCM · '+its.length+' item(ns) · emitida em '+esc(agora.toLocaleString('pt-BR'))+' por '+esc(S.user.nome)+'</div>'+

    '<table><thead><tr><th style="width:4%">Nº</th><th style="width:20%">Código da peça</th><th>Descrição</th><th style="width:7%">Qtd</th><th style="width:14%">Fornecedor / loja</th><th style="width:18%">Observação</th></tr></thead><tbody>'+
    its.map((r,n)=>{const pc=carPeca(a,r);const lk=v(a,r,'Link');return '<tr><td>'+(n+1)+'</td><td style="font:700 13px/1.3 Consolas,monospace">'+esc(pc.cod||'— sem código —')+(pc.pid?'<br><small style="font-weight:400">ID PCM: '+esc(pc.pid)+'</small>':'')+'</td><td>'+esc(pc.desc)+'</td><td style="text-align:center;font-weight:700">'+esc(o[carChave(a,r)])+'</td><td>'+esc(v(a,r,'Loja'))+(lk?'<br><small style="word-break:break-all">'+esc(lk)+'</small>':'')+'</td><td>'+esc(v(a,r,'Observação'))+'</td></tr>';}).join('')+'</tbody></table>'+
    '<div class="ass"><div>Solicitante (Manutenção)</div><div>Aprovação</div><div>Financeiro / Compras</div></div>';
  pdfAbrir('Solicitacao_compra_'+num);
}
function detCompra(i){
  const a=aba('Compras');const r=a.linhas[i];if(!r)return;const link=v(a,r,'Link');
  abre('<div class="ph"><b>Compra</b><button class="lnk" data-x>Fechar</button></div><div class="kv">'+a.cab.map((c,j)=>r[j]!==''?'<b>'+esc(c)+'</b><span>'+esc(r[j])+'</span>':'').join('')+'</div>'+
    (podeLancar()?'<label>Status</label><select id="cS" class="f">'+['A pedir','Pedido','Recebido','Cancelado'].map(s=>'<option'+(s===v(a,r,'Status')?' selected':'')+'>'+s+'</option>').join('')+'</select><div class="btns"><button class="btn p" id="cSv">Salvar</button>'+(link?'<a class="btn" target="_blank" rel="noopener" href="'+esc(link)+'">Abrir loja ↗</a>':'')+'</div><div class="note">Ao marcar Recebido, a quantidade entra no estoque da peça.</div>':(link?'<a class="btn" target="_blank" rel="noopener" href="'+esc(link)+'">Abrir loja ↗</a>':'')));
  if(isAdm()&&podeLancar()){const bx=document.createElement('button');bx.className='btn';bx.textContent='✏️ Editar item';$('#pane .btns').appendChild(bx);
    bx.onclick=()=>{const conferir={};const ip=col(a.cab,'ID peça','ID');const ic=col(a.cab,'Código');if(ip>=0)conferir[a.cab[ip]]=r[ip];if(ic>=0)conferir[a.cab[ic]]=r[ic];editarLinha('Compras',r,{linha:aCompraLinha(i),idx:i,conferir},'compra');};}
  if(podeLancar())$('#cSv').onclick=async()=>{
    const novo=$('#cS').value,ant=v(a,r,'Status');
    const conferir={};const ip=col(a.cab,'ID peça','ID');const ic=col(a.cab,'Código');if(ip>=0)conferir[a.cab[ip]]=r[ip];if(ic>=0)conferir[a.cab[ic]]=r[ic];
    await enfileira({tipo:'atualizar',aba:'Compras',linha:aCompraLinha(i),idx:i,conferir,campos:{Status:novo}});
    if(novo==='Recebido'&&ant!=='Recebido'){const pid=v(a,r,'ID peça','ID');const q=num(v(a,r,'Qtd'));const ab=/^M\d+$/.test(pid)?'manuais_pecas':'Peças';if(pid&&q)await enfileira({tipo:'somar',aba:ab,id:pid,campos:{'Estoque atual':q}});}
    toast('Compra atualizada');fecha();renderLista();
  };
}

const CK_AB='Checklist itens',CK_RG='Checklist registros';
S.ckModo='fazer';S.ck=ls.get('pcm2_ck_rascunho')||null;   // rascunho em andamento fica salvo no celular

function ckFazer(){

/* PDF: monta o relatório e abre "Imprimir → Salvar como PDF" */
function pdfChecklist(uid,linhas){
  if(!linhas.length){toast('Checklist vazio');return;}

  const n={ok:0,nok:0,na:0,p:0};L.forEach(x=>{const r=norm(x.res);if(r==='ok')n.ok++;else if(r==='nao ok')n.nok++;else if(r==='n/a')n.na++;else n.p++;});
  let rows='',ult='';
  L.forEach(x=>{const k=x.eq+' — '+x.cat;if(k!==ult){rows+='<tr class="g"><td colspan="3">'+esc(k)+'</td></tr>';ult=k;}rows+='<tr><td>'+esc(x.item)+'</td><td class="'+(norm(x.res)==='nao ok'?'nok':'')+'">'+esc(x.res)+'</td><td>'+esc(x.obs)+'</td></tr>';});
  $('#print').innerHTML='<h1>Checklist diário · PCM</h1><div class="meta">Data: <b>'+esc(br(L[0].data))+'</b> · Responsável: <b>'+esc(L[0].resp)+'</b> · Concluído em: '+esc(L[0].fim)+' · Nº '+esc(uid)+'<br>Resultado: '+n.ok+' OK · '+n.nok+' não OK · '+n.na+' N/A'+(n.p?' · '+n.p+' pendentes':'')+'</div>'+
    '<table><thead><tr><th style="width:52%">Item verificado</th><th style="width:12%">Resultado</th><th>Observação</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="ass"><div>Executante</div><div>Supervisor / PCM</div></div>';
  pdfAbrir('Checklist_'+String(L[0].data).replace(/\D/g,'')+'_'+uid);

/* ================= ESQUEMA ELÉTRICO (folhas no Drive, índice por TAG / código) ================= */
const ESQ_CACHE='pcm-esquema';
const ESQ_IDXT=['Índice de Páginas','Índice de Equipamentos','Capa'];
async function esqIndice(forcar){
  if(!S.esq){try{const c=await get('kv','esqidx');if(c)S.esq=c;}catch(e){}}
  const velho=!S.esq||Date.now()-S.esq.t>864e5;
  if((forcar||velho)&&navigator.onLine){
    try{const d=await api('esquemaIdx');S.esq={t:Date.now(),l:d.linhas,pdf:d.pdf||'',total:d.total||d.linhas.length};S.esqM=null;try{await put('kv','esqidx',S.esq);}catch(e){}}
    catch(e){if(!S.esq)throw e;}
  }
  if(!S.esq||!S.esq.l.length)throw new Error('O índice do esquema ainda não foi carregado'+(navigator.onLine?'':' (sem internet)'));
  if(!S.esqM){
    const T={},P={},F={};
    S.esq.l.forEach(r=>{
      const n=+r[0];F[n]={n,t:r[1],tags:r[2]?r[2].split(' '):[],devs:r[4]?r[4].split(' '):[],cods:r[5]?r[5].split(' '):[]};
      F[n].tags.forEach(t=>(T[t]=T[t]||[]).push(n));
      const pp={};String(r[3]||'').split(';').forEach(x=>{const k=x.split('=');if(k.length<2)return;pp[k[0]]=k[1].split('|').map(b=>b.split(',').map(Number));});
      P[n]=pp;
    });
    S.esqM={T,P,F};
  }
  return S.esqM;
}
function esqEhIndice(f){return ESQ_IDXT.some(x=>String(f.t).indexOf(x)===0);}
/* folhas de uma TAG: a folha "dela" primeiro, índices por último */
function esqFolhasTag(M,tag){
  const L=(M.T[tag]||[]).slice();
  const peso=n=>{const f=M.F[n];return esqEhIndice(f)?2:(f.t.indexOf(tag)>=0?0:1);};
  return L.sort((a,b)=>peso(a)-peso(b)||a-b);
}
function esqBusca(M,q){
  q=String(q||'').trim().toUpperCase();if(!q)return [];
  const out=[];const nq=norm(q);
  Object.values(M.F).forEach(f=>{
    const hit=[];
    f.tags.forEach(t=>{if(t===q||t.indexOf(q)===0)hit.push(t);});
    f.cods.forEach(c=>{if(c===q||c.indexOf(q)>=0&&q.length>=4)hit.push(c);});
    f.devs.forEach(d=>{if(d===q||(d.indexOf(q)===0&&q.length>=3))hit.push(d);});
    const tit=norm(f.t).indexOf(nq)>=0;
    if(hit.length||tit)out.push({n:f.n,hit:[...new Set(hit)].slice(0,6),tit,p:(hit.indexOf(q)>=0?0:1)+(esqEhIndice(f)?2:0)});
  });
  return out.sort((a,b)=>a.p-b.p||a.n-b.n);
}
async function esqImagem(n){
  const k='esquema/p'+String(n).padStart(3,'0')+'.png';
  try{const c=await caches.open(ESQ_CACHE);const r=await c.match(k);if(r)return URL.createObjectURL(await r.blob());}catch(e){}
  if(!navigator.onLine)throw new Error('Folha '+n+' ainda não foi aberta neste aparelho (sem internet)');
  const d=await api('esquemaPag',{n});
  const bin=atob(d.b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const blob=new Blob([u],{type:d.tipo||'image/png'});
  try{const c=await caches.open(ESQ_CACHE);await c.put(k,new Response(blob,{headers:{'Content-Type':d.tipo||'image/png'}}));}catch(e){}
  return URL.createObjectURL(blob);
}

    '<div id="esLista" class="esqlista" hidden><div class="esqlh"><input id="esQ" class="f" type="search" placeholder="TAG (MI04A), código (GV2ME16) ou descrição da folha"><button class="btn" id="esLx">Fechar</button></div><div id="esRes"></div></div>';
  document.body.appendChild(el);
  const E=S.esqV={n:1,z:1,marca:'',hits:[]};
  $('#esX').onclick=()=>{el.hidden=true;document.body.classList.remove('esqon');};
  $('#esAnt').onclick=()=>esqVai(E.n-1);$('#esPro').onclick=()=>esqVai(E.n+1);
  $('#esN').onchange=()=>esqVai(num($('#esN').value)||1);
  $('#esZp').onclick=()=>esqZoom(E.z*1.5);$('#esZm').onclick=()=>esqZoom(E.z/1.5);
  $('#esL').onclick=()=>esqLista($('#esQ').value);$('#esLx').onclick=()=>{$('#esLista').hidden=true;};
  $('#esQ').oninput=()=>{clearTimeout(E.qt);E.qt=setTimeout(()=>esqLista($('#esQ').value),200);};
  $('#esHits').onclick=e=>{const b=e.target.closest('[data-f]');if(b)esqVai(+b.dataset.f);};
  $('#esRes').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;if(b.dataset.m)E.marca=b.dataset.m;$('#esLista').hidden=true;esqVai(+b.dataset.f);};
  return el;
}
function esqZoom(z){const E=S.esqV;const box=$('#esBox');const cx=(box.scrollLeft+box.clientWidth/2)/box.scrollWidth,cy=(box.scrollTop+box.clientHeight/2)/box.scrollHeight;
  E.z=Math.max(1,Math.min(6,z));$('#esIn').style.width=(E.z*100)+'%';
  requestAnimationFrame(()=>{box.scrollLeft=cx*box.scrollWidth-box.clientWidth/2;box.scrollTop=cy*box.scrollHeight-box.clientHeight/2;});}
/* abre o visualizador. o = {tag, cod, folha, tags:[..], titulo} */
async function abreEsquema(o){
  o=o||{};const el=esqUI();el.hidden=false;document.body.classList.add('esqon');
  const E=S.esqV;$('#esMsg').textContent='Carregando índice…';$('#esMsg').hidden=false;
  let M;try{M=await esqIndice();}catch(e){$('#esMsg').textContent=e.message;return;}
  E.total=S.esq.total||Object.keys(M.F).length;
  if(o.tag){E.marca=o.tag;E.hits=esqFolhasTag(M,o.tag);E.rot='TAG '+o.tag;}
  else if(o.tags){E.marca='';const set={};o.tags.forEach(t=>(M.T[t]||[]).forEach(n=>{if(!esqEhIndice(M.F[n]))(set[n]=set[n]||[]).push(t);}));E.hits=Object.keys(set).map(Number).sort((a,b)=>a-b);E.hitTags=set;E.rot=o.titulo||'Equipamento';E.multi=o.tags;}
  else if(o.cod){E.marca=String(o.cod).toUpperCase();E.hits=esqBusca(M,o.cod).map(x=>x.n);E.rot='Código '+o.cod;}
  else {E.hits=[];E.rot='';E.marca='';}
  if(!o.tags){E.hitTags=null;E.multi=null;}
  esqHits();
  if(E.hits.length)esqVai(E.hits[0]);
  else if(o.tag||o.cod){$('#esMsg').textContent=(o.tag?'A TAG '+o.tag:'O código '+o.cod)+' não aparece nas folhas do esquema.';$('#esQ').value=o.tag||o.cod||'';esqLista($('#esQ').value);if(!E.cur)esqVai(o.folha||1,true);}
  else if(o.folha)esqVai(o.folha);
  else {esqLista('');if(!E.cur)esqVai(1,true);}
}
function esqHits(){
  const E=S.esqV;const M=S.esqM;
  $('#esHits').innerHTML=E.hits.length?'<span class="note">'+esc(E.rot)+' · '+E.hits.length+' folha'+(E.hits.length>1?'s':'')+':</span>'+E.hits.map(n=>'<button class="chip" data-f="'+n+'" aria-pressed="'+(n===E.n)+'" title="'+esc(M.F[n]?M.F[n].t:'')+'">Fl. '+n+(M.F[n]&&esqEhIndice(M.F[n])?' (índice)':'')+'</button>').join(''):'';
  $('#esHits').hidden=!E.hits.length;
}
async function esqVai(n,quieto){
  const E=S.esqV;n=Math.max(1,Math.min(E.total||426,n|0));E.n=n;E.cur=n;
  const M=S.esqM;const f=M&&M.F[n];
  $('#esN').value=n;$('#esTi').textContent='Folha '+n+(E.total?' de '+E.total:'');$('#esSu').textContent=f?f.t:'';
  esqHits();
  $('#esMsg').hidden=false;$('#esMsg').textContent='Carregando folha '+n+'…';$('#esMk').innerHTML='';
  try{
    const url=await esqImagem(n);if(E.n!==n)return;
    const img=$('#esImg');if(img.dataset.u)URL.revokeObjectURL(img.dataset.u);img.dataset.u=url;img.src=url;
    await new Promise(ok=>{if(img.complete)ok();else{img.onload=ok;img.onerror=ok;}});
    $('#esMsg').hidden=true;
    /* marca a TAG (ou as TAGs do equipamento) com um retângulo vermelho */
    const P=(M&&M.P[n])||{};const marcas=E.multi?(E.hitTags&&E.hitTags[n]||[]):(E.marca&&P[E.marca]?[E.marca]:[]);
    let primeiro=null;
    $('#esMk').innerHTML=marcas.map(t=>(P[t]||[]).map(b=>{const h='<div class="esqmk" style="left:'+(b[0]/10-.6)+'%;top:'+(b[1]/10-.8)+'%;width:'+(b[2]/10+1.2)+'%;height:'+(b[3]/10+1.6)+'%"><span>'+esc(t)+'</span></div>';if(!primeiro)primeiro=b;return h;}).join('')).join('');
    if(primeiro){if(E.z<2.5)esqZoom(2.5);requestAnimationFrame(()=>{const box=$('#esBox');box.scrollLeft=primeiro[0]/1000*box.scrollWidth-box.clientWidth/2;box.scrollTop=primeiro[1]/1000*box.scrollHeight-box.clientHeight/2;});}
    else if(E.marca&&!quieto&&f&&f.cods.indexOf(E.marca)>=0){$('#esMsg').hidden=false;$('#esMsg').textContent='O código '+E.marca+' aparece nesta folha (lista de materiais / desenho).';}
    if(navigator.onLine&&n<(E.total||426))esqImagem(n+1).then(u=>URL.revokeObjectURL(u)).catch(()=>{});
  }catch(e){if(E.n===n)$('#esMsg').textContent=e.message;}
}
async function esqLista(q){
  const M=await esqIndice().catch(()=>null);if(!M)return;
  $('#esLista').hidden=false;
  const R=q?esqBusca(M,q):Object.values(M.F).map(f=>({n:f.n,hit:[],tit:false}));
  $('#esRes').innerHTML=(isAdm()&&S.esq.pdf&&!q?'<div class="btns" style="margin:4px 0 8px"><a class="btn" target="_blank" rel="noopener" href="'+esc(S.esq.pdf)+'">📄 Abrir o PDF original completo (Drive) ↗</a></div>':'')+
    '<div class="note">'+(q?R.length+' folha(s) com "'+esc(q)+'"':'Todas as '+R.length+' folhas — toque para abrir')+'</div>'+
    '<div class="list">'+R.slice(0,q?200:500).map(x=>{const f=M.F[x.n];return '<button class="card" data-f="'+x.n+'"'+(x.hit[0]?' data-m="'+esc(x.hit[0])+'"':'')+'><div class="eqtag">Fl. '+x.n+'</div><div class="ci"><div class="cd" style="font-weight:500">'+esc(f.t||'—')+'</div>'+(x.hit.length?'<div class="cm">'+x.hit.map(esc).join(' · ')+'</div>':(f.tags.length&&!q?'<div class="cm">'+esc(f.tags.slice(0,8).join(' · '))+(f.tags.length>8?' …':'')+'</div>':''))+'</div></button>';}).join('')+'</div>';
  if(!q)$('#esQ').focus();
}

/* ---- Mais ---- */

    '<div class="box"><b>Dados no celular</b><div class="note">'+Object.keys(S.d.abas).map(n=>esc(n)+': '+S.d.abas[n].linhas.length).join(' · ')+'</div><div class="note">Imagens guardadas: '+imgs+'</div><div class="note">Lançamentos aguardando envio: '+nf+'</div><div class="btns"><button class="btn" id="mFila">Ver fila</button><button class="btn" id="mImg">Baixar imagens de novo</button></div></div>'+
    (k.linhas.length?'<div class="box"><b>Kits</b>'+kitsHtml(k)+'</div>':'')+
